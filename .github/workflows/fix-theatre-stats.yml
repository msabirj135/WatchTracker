name: Fix Theatre Statistics

on:
  push:
    branches:
      - agent/improve-stats-watch-time

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix theatre stats year filtering')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/improve-stats-watch-time
          fetch-depth: 0

      - name: Apply theatre statistics fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/sabir/watchtracker/ui/library/LibraryScreens.kt")
          text = path.read_text(encoding="utf-8-sig")

          old_call = '''        if (libraryUiState.theatreWatchEntries.isNotEmpty()) {
            item { TheatreStatisticsCard(libraryUiState) }
        }

        item {
            StatisticsYearSelector(
'''
          new_call = '''        item {
            StatisticsYearSelector(
'''
          if old_call in text:
              text = text.replace(old_call, new_call, 1)

          old_selector_end = '''            )
        }

        item { AnnualSummaryCard(yearSummary) }
'''
          new_selector_end = '''            )
        }

        if (libraryUiState.theatreWatchEntries.isNotEmpty()) {
            item {
                TheatreStatisticsCard(
                    state = libraryUiState,
                    selectedYear = selectedYear
                )
            }
        }

        item { AnnualSummaryCard(yearSummary) }
'''
          if old_selector_end not in text:
              raise SystemExit("Statistics year selector ending was not found")
          text = text.replace(old_selector_end, new_selector_end, 1)

          old_card = '''private fun TheatreStatisticsCard(state: LibraryUiState) {
    Card(
'''
          new_card = '''private fun TheatreStatisticsCard(
    state: LibraryUiState,
    selectedYear: Int
) {
    val theatreDatesForYear = state.theatreWatchEntries.flatMap { entry ->
        entry.visitDates.filter { epochDay ->
            LocalDate.ofEpochDay(epochDay).year == selectedYear
        }.map { epochDay ->
            entry.item to epochDay
        }
    }

    val theatreMovieCount = theatreDatesForYear
        .map { (item, _) -> item.mediaType to item.tmdbId }
        .distinct()
        .size

    val theatreWatchMinutes = theatreDatesForYear.sumOf { (item, _) ->
        item.runtimeMinutes ?: 0
    }

    Card(
'''
          if old_card in text:
              text = text.replace(old_card, new_card, 1)
          elif 'private fun TheatreStatisticsCard(\n    state: LibraryUiState,\n    selectedYear: Int\n)' not in text:
              raise SystemExit("TheatreStatisticsCard declaration was not found")

          old_metrics = '''                AnnualMetric(
                    modifier = Modifier.weight(1f),
                    value = state.theatreWatchEntries.size.toString(),
                    label = "Movies"
                )
                AnnualMetric(
                    modifier = Modifier.weight(1f),
                    value = state.theatreMoviesThisYear.toString(),
                    label = "This year"
                )
                AnnualMetric(
                    modifier = Modifier.weight(1f),
                    value = formatWatchHours(state.theatreWatchMinutes),
                    label = "Watch time"
                )
'''
          new_metrics = '''                AnnualMetric(
                    modifier = Modifier.weight(1f),
                    value = theatreMovieCount.toString(),
                    label = "Movies"
                )
                AnnualMetric(
                    modifier = Modifier.weight(1f),
                    value = formatWatchHours(theatreWatchMinutes),
                    label = "Watch time"
                )
'''
          if old_metrics in text:
              text = text.replace(old_metrics, new_metrics, 1)

          if 'label = "This year"' in text:
              raise SystemExit("Theatre 'This year' metric is still present")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sabir/watchtracker/ui/library/LibraryScreens.kt
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix theatre stats year filtering"
          git push origin agent/improve-stats-watch-time
